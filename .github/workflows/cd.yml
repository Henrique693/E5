name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  staging:
    name: staging-validation
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Baixar artefato produzido pela CI
        uses: actions/download-artifact@v4
        with:
          name: gerador-qr-release
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validar pacote de homologação
        run: |
          test -s release/gerador-qr.apk
          test -s release/web/index.html
          echo "Validação de staging concluída: APK e build Web encontrados." >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar pacote validado para produção
        uses: actions/upload-artifact@v4
        with:
          name: gerador-qr-staging-approved
          path: release/
          if-no-files-found: error
          retention-days: 14

  production:
    name: publish-production
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Baixar o código da versão validada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Baixar o pacote aprovado em staging
        uses: actions/download-artifact@v4
        with:
          name: gerador-qr-staging-approved
          path: release

      - name: Obter versão e tag da release
        id: release-info
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' gerador_qr/pubspec.yaml | cut -d'+' -f1)"
          if [ -z "$VERSION" ]; then
            echo "Não foi possível identificar a versão no pubspec.yaml." >&2
            exit 1
          fi
          echo "tag=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          name: Gerador QR Code ${{ steps.release-info.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
          files: |
            release/gerador-qr.apk
            release/web/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
